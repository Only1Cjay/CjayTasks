<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B5EA7"/>
      <stop offset="100%" stop-color="#3DA69B"/>
    </linearGradient>
  </defs>

  <!-- Rounded gradient background -->
  <rect width="512" height="512" rx="120" fill="url(#g)"/>

  <!-- Task list: 3 rows, each with a checkmark and a line -->
  <g fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Row 1: checkmark + line -->
    <polyline points="130 160 170 200 230 130"/>
    <line x1="290" y1="165" x2="390" y2="165"/>

    <!-- Row 2: checkmark + line -->
    <polyline points="130 260 170 300 230 230"/>
    <line x1="290" y1="265" x2="390" y2="265"/>

    <!-- Row 3: checkmark + line -->
    <polyline points="130 360 170 400 230 330"/>
    <line x1="290" y1="365" x2="390" y2="365"/>
  </g>
</svg>
